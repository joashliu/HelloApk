name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias ledger \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ledgerpass123 \
            -keypass ledgerpass123 \
            -dname "CN=Ledger, OU=Dev, O=Personal, L=HK, S=HK, C=HK"

      - name: Base64 encode
        run: base64 -w 0 release.keystore > keystore.b64

      - name: Print base64
        run: cat keystore.b64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            release.keystore
            keystore.b64
